receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'my_job'
          scrape_interval: 5s
          static_configs:
            - targets: ['localhost:9464']

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [debug]
