services:
  oteljob:
    build:
      context: ./standalone
    stdin_open: true
    command:
      - -no-translation=${OTELJOB_NO_TRANSLATION:-false}
    networks:
      - otelnet

  otel-collector:
    build:
      context: ./otelcollector
    depends_on:
      - oteljob
      - prometheus
    volumes:
      - ./otelcol-config.compose.yaml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=${OTELCOL_FEATURE_GATES:-}
    networks:
      - otelnet

  prometheus:
    build:
      context: ./prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --log.level=debug
    networks:
      - otelnet

networks:
  otelnet:
    driver: bridge
