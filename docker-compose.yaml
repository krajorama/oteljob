services:
  oteljob:
    build: .
    stdin_open: true
    networks:
      - otelnet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    depends_on:
      - oteljob
      - prometheus
    volumes:
      - ./otelcol-config.compose.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - otelnet

  prometheus:
    build:
      context: ./prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --log.level=debug
    networks:
      - otelnet

networks:
  otelnet:
    driver: bridge
