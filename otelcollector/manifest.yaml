dist:
  module: github.com/krajorama/oteljob/otelcol-custom
  name: otelcol-custom
  description: Minimal otelcol-contrib build with the krajo/job-instance-persistence fork
  version: 0.158.0-krajo
  output_path: /src/_build

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.158.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.158.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.158.0

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.158.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.64.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.64.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver => /contrib-fork/receiver/prometheusreceiver
  - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter => /contrib-fork/exporter/prometheusremotewriteexporter
  - github.com/open-telemetry/opentelemetry-collector-contrib/pkg/translator/prometheusremotewrite => /contrib-fork/pkg/translator/prometheusremotewrite
